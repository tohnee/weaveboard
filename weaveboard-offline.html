<!doctype html>
<!-- weaveboard-engine: v7 · Task Board 制图桌风格 + vibe coding 工作流（in-review 状态 / 执行者 / 验收标准）· 内嵌数据入口见 id=weaveboard-seed，数据契约见仓库 references/schema.md -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Task Board · 技术项目管理面板</title>
<style>
/* ============ Task Board · 制图桌 ============
   工程制图美学：冷调胶片底 / 纯白卡纸 / 普鲁士墨蓝 / 红铅笔关键路径
   等宽数字与坐标网格 —— 计划就该画在制图纸上            */
:root{
  --bg:#EDF1F6;--sheet:#F7F9FC;--surface:#FFFFFF;
  --ink:#1B2A41;--ink2:#2E415E;--muted:#5C6B82;
  --line:#DFE5EE;--line2:#C9D3E2;
  --blue:#2D5FB8;--blue-deep:#1F4A96;--red:#D9483B;--red-deep:#B73327;
  --amber:#8A6414;--green:#1E7A4F;--graphite:#74839B;
  --sans:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow-sm:0 1px 3px #1B2A4118,0 8px 22px #1B2A4114;
  --shadow-lg:0 24px 60px #1B2A4126;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:var(--sans);color:var(--ink);background:var(--bg)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
.app{height:100%;display:grid;grid-template:58px 1fr/64px 1fr 292px}
.top{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface);box-shadow:0 2px 6px #1B2A4118;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:225px}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#3568C4,#1F4A96);box-shadow:0 2px 8px #1B2A4133}
.brand b{display:block;font:800 15px/1.2 var(--sans);letter-spacing:.2px;color:var(--ink)}
.brand small{display:block;color:var(--graphite);font:700 9px var(--mono);letter-spacing:1.4px}
.status{display:block;color:var(--muted);font-size:10px}
.top .views{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:#E3E9F3}
.top .spacer{flex:1}
.btn,.tool{height:34px;padding:0 11px;border:1px solid var(--line2);border-radius:10px;background:transparent;color:var(--ink2);font-size:11px;font-weight:600}
.btn:hover,.tool:hover{background:#EEF2F8}
.view{height:28px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;font-weight:600}
.view:hover{color:var(--ink)}
.view.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #1B2A4124,0 2px 6px #1B2A4118}
.tool.active{border-color:var(--blue);background:var(--blue);color:#fff}
.btn.primary{border-color:var(--blue-deep);background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}
.saved{padding:6px 9px;border-radius:20px;background:#DFF0E4;color:var(--green);font:700 10px var(--mono)}
.side{grid-row:2;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 8px;border-right:1px solid var(--line);background:var(--surface);z-index:20}
.tool{width:46px;height:44px;padding:4px;font-size:10px}
.tool span{display:block;font-size:16px;line-height:17px}
.side .bottom{margin-top:auto}
.stage{grid-column:2;grid-row:2;position:relative;overflow:hidden;isolation:isolate}
.canvas{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:var(--sheet);background-image:linear-gradient(rgba(27,42,65,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,65,.05) 1px,transparent 1px),linear-gradient(rgba(27,42,65,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,65,.09) 1px,transparent 1px);background-size:30px 30px,30px 30px,150px 150px,150px 150px}
.world{position:absolute;left:0;top:0;width:2400px;height:1600px;transform-origin:0 0;will-change:transform;isolation:isolate}
.card-layer{position:absolute;inset:0;z-index:10!important;pointer-events:none}
.card{position:absolute;z-index:1;width:245px;min-height:128px;padding:15px 16px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);isolation:isolate;box-shadow:var(--shadow-sm);pointer-events:auto;cursor:grab;user-select:none;color:var(--ink);pointer-events:auto;cursor:grab;user-select:none;transform-origin:50% 50%;transition:box-shadow .15s,border-color .15s}
.card:before{content:"";position:absolute;z-index:2;top:-1px;left:13px;right:13px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
.card:hover,.card.selected{border-color:var(--blue);box-shadow:0 0 0 3px #2D5FB826,0 4px 12px #1B2A411E,0 16px 34px #1B2A4120}
.card.multi{box-shadow:0 0 0 3px #7A8CD8B3,0 16px 34px #1B2A4120}
.card.dragging{z-index:12;cursor:grabbing;box-shadow:0 0 0 3px #2D5FB84D,0 24px 56px #1B2A4130}
.card .meta{color:var(--accent);font:800 10px var(--mono);letter-spacing:.5px}
.card h3{margin:8px 0 6px;font:700 14.5px/1.35 var(--sans);color:var(--ink)}
.card p{margin:0;color:#46536B;font-size:12px;line-height:1.55;white-space:pre-wrap}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:11px;color:var(--muted);font:700 10px var(--mono)}
.bar{flex:1;height:5px;overflow:hidden;border-radius:5px;background:#DDE4EF}
.bar i{display:block;height:100%;background:var(--accent)}
.port{position:absolute;z-index:4;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:var(--accent);box-shadow:0 1px 4px #1B2A4140;opacity:0;transition:opacity .15s}
.card:hover .port,.card.selected .port,.connecting .port{opacity:1}
.port.n{top:-5px;left:calc(50% - 5px)}.port.s{bottom:-5px;left:calc(50% - 5px)}.port.w{left:-5px;top:calc(50% - 5px)}.port.e{right:-5px;top:calc(50% - 5px)}
.lasso{position:absolute;z-index:12;border:1px solid var(--blue);background:#2D5FB814;pointer-events:none}
.hint{position:absolute;z-index:8;left:14px;bottom:14px;padding:8px 11px;border:1px solid var(--line2);border-radius:10px;background:#FFFFFFE8;backdrop-filter:blur(8px);color:var(--muted);font-size:10px}
.zoom{position:absolute;z-index:9;right:14px;bottom:14px;display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:#FFFFFFE8;backdrop-filter:blur(8px);overflow:hidden}
.zoom button,.zoom span{height:32px;min-width:34px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:11px}
.zoom span{display:grid;place-items:center;min-width:48px;font:700 11px var(--mono)}
.inspector{grid-column:3;grid-row:2;overflow:auto;border-left:1px solid var(--line);background:var(--bg);z-index:20}
.inspect-head{position:sticky;z-index:2;top:0;padding:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.eyebrow{color:var(--blue);font:700 10px var(--mono);letter-spacing:1.6px}
.inspect-head h2{margin:5px 0 2px;font:700 16px/1.3 var(--sans);color:var(--ink)}
.inspect-body{padding:14px}
.section{margin-bottom:15px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.section h3{margin:0 0 9px;font:700 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--graphite)}
.field{display:block;margin:9px 0;color:var(--muted);font-size:10px}
.field input,.field textarea,.field select{width:100%;margin-top:4px;padding:8px 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);font-size:12px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px #2D5FB822}
.field textarea{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row-actions{display:flex;flex-wrap:wrap;gap:6px}
.row-actions button{height:30px;padding:0 9px;border:1px solid var(--line2);border-radius:8px;background:transparent;color:var(--ink2);font-size:10px}
.row-actions button:hover{background:#E7EDF6}
.relation{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:6px;margin:6px 0;padding:7px;border-radius:8px;background:#EEF2F8;font-size:10px;color:var(--ink2)}
.relation i{width:7px;height:7px;border-radius:50%}
.empty-inspector{display:grid;place-items:center;height:100%;padding:25px;text-align:center;color:var(--muted)}
.empty-inspector b{display:block;margin-bottom:6px;font-family:var(--sans);color:var(--ink);font-size:14px}
.alt{position:absolute;z-index:14;inset:0;overflow:auto;background:var(--bg)}
.alt .empty-inspector{color:var(--muted)}
.alt .empty-inspector b{color:var(--ink)}
.hidden{display:none!important}
.wbs-summary{display:flex;align-items:center;gap:9px;padding:15px;border-bottom:1px solid var(--line);background:var(--surface)}
.wbs-summary h2{margin:0 14px 0 0;font:700 17px var(--sans);color:var(--ink)}
.wbs-summary span{padding:7px 10px;border-radius:9px;background:var(--sheet);border:1px solid var(--line2);color:var(--muted);font-size:10px}
.wbs-summary span b{margin-right:3px;color:var(--blue-deep);font:700 14px var(--mono)}
.wbs-summary .push{margin-left:auto}
.wbs-grid{min-width:920px}
.wbs-line{display:grid;grid-template-columns:minmax(320px,1.5fr) 110px 110px 120px minmax(250px,1fr);align-items:center;min-height:46px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface);color:#46536B;font-size:11px}
.wbs-line.header{min-height:36px;background:#E7ECF4;color:var(--graphite);font:700 10px var(--mono);letter-spacing:.8px}
.wbs-line.selected{background:#EFF4FC}
.wbs-name{display:flex;align-items:center;gap:7px;min-width:0}
.wbs-name small{width:44px;color:#8B99B0;font:700 10px var(--mono)}
.wbs-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:700}
.wbs-name button{margin-left:auto;border:0;background:transparent}
.wbs-progress{display:flex;align-items:center;gap:6px}
.wbs-progress i{width:62px;height:5px;overflow:hidden;border-radius:5px;background:#DDE4EF}
.wbs-progress i b{display:block;height:100%;background:var(--blue)}
.gantt{position:relative;height:45px;border-left:1px solid var(--line2);background:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),#DEE5F0 calc(20% - 1px),#DEE5F0 20%)}
.gantt>i{position:absolute;top:14px;height:16px;border-radius:5px;background:#9FB3D4;box-shadow:0 2px 5px #1B2A411C}
.gantt>i.blocked{background:#C07A15}
.gantt>i>i{display:block;height:100%;border-radius:5px;background:var(--blue-deep)}
.gantt>b{position:absolute;top:33px;height:5px;border-radius:3px;background:none;border:1.5px dashed #8B99B0}
.gtick{position:absolute;bottom:-1px;font:700 9px var(--mono);font-style:normal;color:#8B99B0;letter-spacing:.2px;white-space:nowrap}
.timeline-list{padding:20px;max-width:900px;margin:auto}
.timeline-item{display:grid;grid-template-columns:120px 18px 1fr;gap:10px;min-height:100px}
.timeline-item time{padding-top:4px;color:var(--muted);font:700 12px var(--mono)}
.timeline-dot{position:relative}
.timeline-dot:before{content:"";position:absolute;left:8px;top:8px;bottom:-8px;width:1px;background:#D3DBE8}
.timeline-dot i{position:absolute;z-index:1;top:4px;left:3px;width:11px;height:11px;border:3px solid var(--bg);border-radius:50%;background:var(--blue)}
.timeline-card{margin-bottom:14px;padding:14px;border:1px solid var(--line2);border-radius:12px;background:var(--surface)}
.timeline-card h3{margin:4px 0;font:700 14px var(--sans);color:var(--ink)}
.timeline-card p{margin:0;color:var(--muted);font-size:11px}
.modal-wrap{position:fixed;z-index:60;inset:0;display:grid;place-items:center;background:#1B2A4173;backdrop-filter:blur(4px)}
.modal{width:min(520px,calc(100% - 26px));max-height:88vh;overflow:auto;padding:20px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--shadow-lg)}
.modal h2{margin:4px 0 12px;font:700 17px var(--sans);color:var(--ink)}
.modal .status{color:var(--muted)}
.modal .section{border-bottom-color:var(--line)}
.modal .section h3{color:var(--graphite)}
.modal .field{color:var(--muted)}
.modal .btn{border-color:var(--line2);background:var(--sheet);color:var(--ink2)}
.modal .btn:hover{background:#EEF2F8}
.modal .btn.primary{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.modal .relation{background:#EEF2F8;color:var(--ink2)}
.modal .row-actions button{border-color:var(--line2);background:var(--sheet);color:var(--ink2)}
.modal .row-actions button:hover{background:#E7EDF6}
.modal-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}
.toast{position:fixed;z-index:90;left:50%;bottom:23px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;border:1px solid #0F1B2E;background:var(--ink);color:#F2F6FC;font-size:11px;box-shadow:var(--shadow-lg)}
@media(max-width:940px){.app{grid-template-columns:58px 1fr}.top{grid-column:1/3}.inspector{display:none}.brand{min-width:155px}.top .btn.optional{display:none}}
@media(max-width:680px){.views .view:nth-child(n+3){display:none}.brand small,.status{display:none}.top{gap:6px;padding:0 7px}.btn,.view{padding:0 7px}.wbs-line{grid-template-columns:minmax(270px,1.4fr) 100px 100px 110px minmax(210px,1fr)}}
</style>
<style>
.rope-canvas{position:absolute;z-index:0;inset:0;width:2400px;height:1600px;pointer-events:none}
.card-layer{z-index:10!important}
.trip-board{padding:20px;min-width:820px}
.trip-hero{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:18px;border-radius:14px;background:linear-gradient(135deg,#16263D,#234B7A);border:1px solid #16263D;color:#EFF4FB;box-shadow:0 16px 36px #1B2A4133}
.trip-hero h2{margin:0 18px 2px 0;font:700 18px var(--sans);color:#fff}
.trip-hero p{margin:0;color:#B9C8DE;font-size:11px}
.trip-stat{padding:9px 11px;border-radius:10px;background:#FFFFFF17;font-size:10px;color:#B9C8DE}
.trip-stat b{display:block;font:700 16px var(--mono);color:#fff}
.trip-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.trip-day{min-height:190px;padding:13px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm)}
.trip-day>header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.trip-day h3{margin:2px 0;font:700 14px var(--sans);color:var(--ink)}
.trip-day time{color:var(--muted);font:700 10px var(--mono)}
.trip-item{display:grid;grid-template-columns:44px 8px 1fr auto;align-items:start;gap:7px;padding:9px 2px;border-top:1px solid var(--line);font-size:10px}
.trip-item time{color:#3A66AD;font:700 10px var(--mono)}
.trip-item i{width:7px;height:7px;margin-top:2px;border-radius:50%;background:var(--trip-accent)}
.trip-item b{font-size:11px}
.trip-item small{display:block;margin-top:3px;color:var(--muted)}
.trip-item em{font-style:normal;color:#3A66AD}
.booking{display:inline-block;padding:3px 6px;border-radius:8px;background:#E7ECF4;color:#46536B;font-size:9px}
.booking.pending{background:#F6EAD4;color:#8A6414}
.booking.risk{background:#F9E4E1;color:#B73327}
@media(max-width:680px){.trip-hero{align-items:flex-start;flex-wrap:wrap}.trip-board{padding:12px;min-width:640px}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn:focus-visible,.tool:focus-visible,.view:focus-visible{outline-offset:-2px}
button:focus:not(:focus-visible){outline:none}
@media(prefers-reduced-motion:reduce){.card,.port,.btn,.tool,.view{transition:none}}
.relation.edit{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.relation.edit .rel-main{flex:1;min-width:130px}
.relation.edit .rel-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relation.edit .rel-main small{color:var(--muted)}
.relation.edit select{padding:4px 6px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink);font-size:10px}
.relation.edit .lag{width:50px;padding:4px 6px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink);font-size:10px}
.relation.edit .rel-tag{color:var(--muted);font-size:10px}
.relation.edit .rel-cut{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#8B99B0;font-size:11px}
.relation.edit .rel-cut:hover{background:#F9E4E1;color:#B73327}
.risk-score{margin:4px 0 9px;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:#EEF2F8;color:#46536B;font-size:10px}
.risk-score b{font:700 14px var(--mono);color:var(--blue-deep)}
.risk-score.mid{background:#F6EAD4;border-color:#E2CF9C;color:#8A6414}
.risk-score.mid b{color:#8A6414}
.risk-score.high{background:#F9E4E1;border-color:#EBB9B2;color:#B73327}
.risk-score.high b{color:#B73327}
.wbs-line.critical{background:#FBEBE9}
.gantt>i.crit{box-shadow:inset 0 0 0 2px var(--red),0 2px 5px #1B2A411C}
.kanban-board{display:grid;grid-template-columns:repeat(5,minmax(178px,1fr));gap:12px;padding:16px;min-width:1000px;align-items:start}
.kanban-col{padding:11px;border:1px solid var(--line2);border-radius:12px;background:#E9EEF6}
.kanban-col[data-col="in-review"]{background:#E3EBF9}
.kanban-col[data-col="blocked"]{background:#F6ECD9}
.kanban-col>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:2px 3px}
.kanban-col h3{margin:0;font:700 12px var(--sans);color:var(--ink)}
.kanban-col>header span{color:var(--muted);font:700 10px var(--mono)}
.kanban-card{position:relative;margin-bottom:8px;padding:10px 30px 10px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);box-shadow:0 1px 2px #1B2A4112;cursor:pointer}
.kanban-card b{display:block;font-size:11px;line-height:1.4;color:var(--ink)}
.kanban-card small{display:block;margin:4px 0 7px;color:var(--muted);font-size:10px}
.kanban-card .bar{height:5px}
.kanban-card.selected{border-color:var(--blue);box-shadow:0 0 0 3px #2D5FB826}
.kanban-card.critical{border-color:#EBB9B2}
.kanban-card.critical .bar i{background:var(--red-deep)!important}
.kanban-card .crit-tag{position:absolute;top:-7px;right:26px;padding:2px 6px;border-radius:7px;background:var(--red);color:#fff;font:700 9px var(--mono);font-style:normal}
.kanban-card .adv{position:absolute;top:8px;right:6px;width:22px;height:22px;border:0;border-radius:6px;background:#E7ECF4;color:var(--blue-deep);font-size:11px}
.kanban-card .adv:hover{background:#D9E2F0}
.ex{font-style:normal;padding:1px 5px;border-radius:6px;background:#E7ECF4;color:#46536B;font:700 9px var(--mono);letter-spacing:.4px}
.ex.ai{background:#DCE6FA;color:#1F4A96}
.card .foot .ex{flex:none}
.pm-dash{padding:18px;max-width:1080px;margin:auto}
.dash-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding:20px;border-radius:14px;background:linear-gradient(135deg,#16263D,#234B7A);border:1px solid #16263D;color:#EFF4FB;box-shadow:0 16px 36px #1B2A4133}
.dash-title{min-width:220px}
.dash-hero h2{margin:0 18px 10px 0;font:700 19px var(--sans);color:#fff}
.dash-hero p{margin:0;color:#B9C8DE;font-size:10px}
.dash-stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.ds{padding:9px 12px;border-radius:10px;background:#FFFFFF17;font-size:10px;color:#B9C8DE}
.ds b{display:block;font:700 16px var(--mono);color:#fff}
.ds.warn{background:#F6DAD4;color:#93382D}
.ds.warn b{color:#B73327}
.dash-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
@media(max-width:940px){.dash-grid{grid-template-columns:1fr}}
.dash-panel{padding:15px;border:1px solid var(--line2);border-radius:12px;background:var(--surface)}
.dash-panel h3{margin:0 0 10px;font:700 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--graphite)}
.dash-item{display:flex;align-items:center;gap:9px;margin-bottom:7px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer}
.dash-item:hover{border-color:#B9C6DB}
.dash-item.picked{border-color:var(--blue);box-shadow:0 0 0 3px #2D5FB826}
.dash-item b{display:block;font-size:11px;line-height:1.35;color:var(--ink)}
.dash-item small{display:block;margin-top:2px;color:var(--muted);font-size:10px;line-height:1.45}
.dash-item.critical small{color:#A05850}
.dash-item .idx{flex:none;width:34px;padding:4px 0;border-radius:7px;background:#E7ECF4;color:#46536B;text-align:center;font:700 10px var(--mono)}
.dash-item.critical{background:#FBEBE9;border-color:#EBB9B2}
.dash-item.critical .idx{background:var(--red);color:#fff}
.dash-item .idx.warn{background:#F6EAD4;color:#8A6414}
.risk-pill{flex:none;min-width:32px;padding:5px 0;border-radius:8px;background:#E7ECF4;color:#46536B;text-align:center;font:700 12px var(--mono)}
.risk-pill.mid{background:#F6EAD4;color:#8A6414}
.risk-pill.high{background:var(--red);color:#fff}
.dec-pill{flex:none;padding:4px 8px;border-radius:8px;background:#E7ECF4;color:#46536B;font-size:10px;font-weight:700}
.dec-pill.accepted{background:#DFF0E4;color:#1E7A4F}
.dec-pill.superseded,.dec-pill.deprecated{background:#EAEEF4;color:#74839B}
.load-row{display:flex;align-items:center;gap:9px;margin-bottom:6px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.load-row b{flex:none;width:64px;font-size:11px;color:var(--ink)}
.load-row .load-bar{flex:1;height:6px;overflow:hidden;border-radius:4px;background:#DAE2EF}
.load-row .load-bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.load-row .load-bar i.over{background:var(--red-deep)}
.load-row small{flex:none;color:var(--muted);font:700 10px var(--mono)}
.tpl-list{display:grid;gap:9px;margin:13px 0}
.tpl-list .tpl{display:block;padding:13px 15px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);text-align:left}
.tpl-list .tpl:hover{border-color:var(--blue);background:#F2F6FC}
.tpl-list .tpl b{display:block;margin-bottom:4px;font:700 13px var(--sans);color:var(--ink)}
.tpl-list .tpl span{color:var(--muted);font-size:10px}
</style>

function openDb(){return new Promise((ok,no)=>{const r=indexedDB.open('weaveboard-assets',1);r.onupgradeneeded=()=>r.result.createObjectStore('assets',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function putAsset(rec){const db=await openDb();return new Promise((ok,no)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(rec);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
